<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>小精灵的森林小屋</title>
  <style>
    :root {
      --bg-color: #f4efde;
      --panel-bg: #e2dac2;
      --text-color: #383227;
      --accent-color: #5c7457;
      --border-color: #b8ac90;
      --hover-color: #485c44;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .container { grid-template-columns: 1fr; }
    }

    h2, h3 { margin-top: 0; color: var(--accent-color); }

    .card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .log-container {
      height: 380px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      background-color: #fcfaf2;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column-reverse;
    }

    .log-entry {
      margin-bottom: 8px;
      font-size: 0.9em;
      border-bottom: 1px dashed #e2dac2;
      padding-bottom: 4px;
    }

    .time-stamp {
      color: #887d65;
      font-size: 0.85em;
      margin-right: 6px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      transition: background-color 0.2s;
    }

    button:hover { background-color: var(--hover-color); }
    button:disabled { background-color: #999; cursor: not-allowed; opacity: 0.6; }

    .stat-label { font-weight: bold; }
    .resource-list { list-style: none; padding: 0; margin: 0; }
    .resource-list li { display: flex; justify-content: space-between; margin-bottom: 4px; }
  </style>
</head>
<body>

<div class="container">
  <!-- 左侧：精灵状态与资源面板 -->
  <div>
    <div class="card">
      <h2>小精灵状态</h2>
      <p><span class="stat-label">名字：</span>四岁的小精灵</p>
      <p><span class="stat-label">居所：</span><span id="house-name">树枝搭的小草棚</span></p>
      <p><span class="stat-label">体力：</span><span id="stamina">100</span> / 100</p>
    </div>

    <div class="card">
      <h3>物资储藏</h3>
      <ul class="resource-list">
        <li><span>树枝:</span> <span id="res-wood">0</span></li>
        <li><span>干草:</span> <span id="res-grass">0</span></li>
        <li><span>石头:</span> <span id="res-stone">0</span></li>
        <li><span>野果:</span> <span id="res-fruit">0</span></li>
        <li><span>小木棍(武器):</span> <span id="res-weapon">0</span></li>
        <li><span>奇特小礼物:</span> <span id="res-gift">0</span></li>
      </ul>
    </div>
  </div>

  <!-- 右侧：日志与动作操作 -->
  <div>
    <div class="card">
      <h2>森林日记</h2>
      <div id="log-box" class="log-container"></div>
    </div>

    <div class="card">
      <h3>小精灵的行动</h3>
      <div class="action-grid">
        <button id="btn-gather" onclick="manualGather()">亲自收集物资</button>
        <button id="btn-craft-weapon" onclick="craftWeapon()">削一把木棍</button>
        <button id="btn-explore" onclick="goExplore()">前往森林深处远足</button>
        <button id="btn-upgrade" onclick="upgradeHouse()">扩建房子</button>
      </div>
      <div style="margin-top: 15px; font-size: 0.85em; color: #666; text-align: right;">
        * 游戏自动进行背景挂机与自动保存
        <button onclick="resetData()" style="background:#b33939; margin-left:10px; padding: 2px 6px;">重置存档</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 游戏核心状态
  let gameState = {
    wood: 0,
    grass: 0,
    stone: 0,
    fruit: 5,
    weapon: 0,
    gift: 0,
    stamina: 100,
    houseLevel: 0,
    lastTime: Date.now()
  };

  const houseNames = [
    "树枝搭的小草棚",
    "遮风避雨的树洞",
    "温馨的木板小屋",
    "带有小花园的森林大大城堡"
  ];

  const houseCosts = [
    { wood: 15, grass: 15, stone: 0 },   // 升级到等级1 (树洞)
    { wood: 40, grass: 20, stone: 20 },  // 升级到等级2 (木屋)
    { wood: 100, grass: 50, stone: 80 }  // 升级到等级3 (城堡)
  ];

  // 日志打印功能
  function addLog(text) {
    const logBox = document.getElementById('log-box');
    const timeStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="time-stamp">[${timeStr}]</span>${text}`;
    logBox.insertBefore(entry, logBox.firstChild);
  }

  // 界面刷新
  function updateUI() {
    document.getElementById('res-wood').innerText = gameState.wood;
    document.getElementById('res-grass').innerText = gameState.grass;
    document.getElementById('res-stone').innerText = gameState.stone;
    document.getElementById('res-fruit').innerText = gameState.fruit;
    document.getElementById('res-weapon').innerText = gameState.weapon;
    document.getElementById('res-gift').innerText = gameState.gift;
    document.getElementById('stamina').innerText = gameState.stamina;
    document.getElementById('house-name').innerText = houseNames[gameState.houseLevel];

    // 更新按钮状态
    const btnUpgrade = document.getElementById('btn-upgrade');
    if (gameState.houseLevel >= houseCosts.length) {
      btnUpgrade.innerText = "房屋已达顶级";
      btnUpgrade.disabled = true;
    } else {
      const cost = houseCosts[gameState.houseLevel];
      btnUpgrade.innerText = `扩建房子 (${cost.wood}木 ${cost.grass}草 ${cost.stone}石)`;
      btnUpgrade.disabled = !(gameState.wood >= cost.wood && gameState.grass >= cost.grass && gameState.stone >= cost.stone);
    }
  }

  // 手动收集
  function manualGather() {
    if (gameState.stamina < 5) {
      addLog("小精灵太累了，先休息一下吧...");
      return;
    }
    gameState.stamina -= 5;
    gameState.wood += 1;
    gameState.grass += 1;
    addLog("四岁的小精灵抱回了一小把树枝和干草。");
    updateUI();
    saveGame();
  }

  // 制作防身木棍
  function craftWeapon() {
    if (gameState.wood >= 5) {
      gameState.wood -= 5;
      gameState.weapon += 1;
      addLog("小精灵用小刀认真削好了一把防身的小木棍！");
      updateUI();
      saveGame();
    } else {
      addLog("没有足够的树枝（需要 5 个）。");
    }
  }

  // 远足探险
  function goExplore() {
    if (gameState.fruit < 2) {
      addLog("去远足需要准备足够的食物！(需要 2 个野果)");
      return;
    }
    if (gameState.weapon < 1) {
      addLog("森林深处有点危险，小精灵不敢赤手空拳过去。(需要 1 把小木棍防身)");
      return;
    }

    gameState.fruit -= 2;
    addLog("小精灵背起小背囊，握紧木棍出发去远处探险了...");

    // 随机远足收获
    setTimeout(() => {
      const foundStone = Math.floor(Math.random() * 4) + 1;
      const foundFruit = Math.floor(Math.random() * 3) + 1;
      gameState.stone += foundStone;
      gameState.fruit += foundFruit;
      addLog(`远足归来！小精灵虽然有些疲惫，但找到了 ${foundStone} 块坚硬的石头和 ${foundFruit} 颗野果！`);
      updateUI();
      saveGame();
    }, 2000);
  }

  // 扩建房屋
  function upgradeHouse() {
    if (gameState.houseLevel >= houseCosts.length) return;
    const cost = houseCosts[gameState.houseLevel];
    if (gameState.wood >= cost.wood && gameState.grass >= cost.grass && gameState.stone >= cost.stone) {
      gameState.wood -= cost.wood;
      gameState.grass -= cost.grass;
      gameState.stone -= cost.stone;
      gameState.houseLevel += 1;
      addLog(`【好消息】小精灵依靠自己的双手，把家改造成了“${houseNames[gameState.houseLevel]}”！真棒！`);
      updateUI();
      saveGame();
    }
  }

  // 自动挂机循环（每 5 秒自动搜集微量资源 & 恢复体力）
  function gameLoop() {
    // 体力恢复
    if (gameState.stamina < 100) gameState.stamina = Math.min(100, gameState.stamina + 2);

    // 根据房屋等级自动获得资源（挂机体验）
    const rate = gameState.houseLevel + 1;
    gameState.wood += rate;
    gameState.grass += rate;

    // 随机事件：小动物拜访
    if (Math.random() < 0.15) {
      triggerAnimalEvent();
    }

    updateUI();
    saveGame();
  }

  // 随机小动物拜访事件
  function triggerAnimalEvent() {
    const events = [
      "一只小松鼠跳到了窗台上，好奇地看了看小精灵，留下了一颗坚果。",
      "一只避雨的小麻雀飞到了屋檐下，留下了一根五彩斑斓的羽毛作为礼物。",
      "路过的小白兔在门口蹭了蹭，留下了几颗甜甜的野果。",
      "夜空下的萤火虫飞过，为小精灵的小屋带来了微弱又温暖的光芒。"
    ];
    const randomIndex = Math.floor(Math.random() * events.length);
    gameState.gift += 1;
    gameState.fruit += 1;
    addLog(`【温情时刻】${events[randomIndex]}`);
  }

  // 数据保存与读取（LocalStorage）
  function saveGame() {
    gameState.lastTime = Date.now();
    localStorage.setItem('elf_game_save', JSON.stringify(gameState));
  }

  function loadGame() {
    const saved = localStorage.getItem('elf_game_save');
    if (saved) {
      const parsed = JSON.parse(saved);
      gameState = { ...gameState, ...parsed };

      // 计算离线挂机收益
      const now = Date.now();
      const offlineSeconds = Math.floor((now - gameState.lastTime) / 1000);
      if (offlineSeconds > 10) {
        const offlineGain = Math.min(Math.floor(offlineSeconds / 10), 100); // 离线上限100次
        gameState.wood += offlineGain;
        gameState.grass += offlineGain;
        addLog(`在你离开的这段时间里，小精灵一直在默默忙碌，收集到了 ${offlineGain} 份树枝和干草。`);
      }
    } else {
      addLog("四岁的小精灵在森林深处醒来，四周一片安静。你需要帮他准备食物和住房。");
    }
    updateUI();
  }

  function resetData() {
    if (confirm("确定要重置所有游戏进度吗？")) {
      localStorage.removeItem('elf_game_save');
      location.reload();
    }
  }

  // 初始化游戏
  window.onload = () => {
    loadGame();
    // 每 5 秒进行一次自动挂机结算
    setInterval(gameLoop, 5000);
  };
</script>

</body>
</html>
