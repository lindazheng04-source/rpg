<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小精灵的森林小屋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>🌲 小精灵的森林小屋</h1>

    <!-- 状态与资源面板 -->
    <div class="status-card">
      <div class="status-header">
        <h2>小精灵状态：<span id="elf-status">在家里歇息</span></h2>
        <div>体力：<span id="stamina">100</span> / 100</div>
      </div>
      <div class="resource-grid">
        <div>🪵 树枝: <span id="res-wood">0</span></div>
        <div>🌿 干草: <span id="res-grass">0</span></div>
        <div>🪨 石头: <span id="res-stone">0</span></div>
        <div>🍒 野果: <span id="res-fruit">0</span></div>
        <div>🍖 肉类: <span id="res-meat">0</span></div>
        <div>🥣 果泥: <span id="res-fruitMashing">0</span></div>
        <div>🍖 烤肉: <span id="res-roastedMeat">0</span></div>
        <div>🍲 杂烩汤: <span id="res-meatStew">0</span></div>
        <div>💊 药品: <span id="res-medicine">0</span></div>
        <div>🗡️ 木棍: <span id="res-weapon">0</span></div>
      </div>
      <div class="info-grid">
        <div>🏠 房屋规模：<span id="house-level-info">简陋草棚</span></div>
        <div>🎒 装备背包：<span id="backpack-info">无背包 (负重: 5)</span></div>
        <div>✨ 家园舒适度：<span id="house-comfort-info">5 点</span></div>
      </div>
    </div>

    <!-- 玩家操作工作台 -->
    <div class="section-box">
      <h3>🛠️ 玩家工作台 (利用已有物资帮小精灵制作/建造)</h3>
      
      <!-- 基础进食 -->
      <div class="button-group">
        <button id="btn-eat-fruit" onclick="eatFruit()">🍎 喂野果 (+15体力)</button>
        <button id="btn-eat-meat" onclick="eatMeat()">🍖 喂生肉 (+25体力)</button>
        <button id="btn-eat-fruitMashing" onclick="eatFood('fruitMashing')">🥣 喂甘甜果泥 (+20体力)</button>
        <button id="btn-eat-roastedMeat" onclick="eatFood('roastedMeat')">🍖 喂香喷喷烤肉 (+35体力)</button>
        <button id="btn-eat-meatStew" onclick="eatFood('meatStew')">🍲 喂森林杂烩汤 (+60体力)</button>
        <button id="btn-use-medicine" onclick="useMedicine()">💊 喂服草药膏 (+80体力)</button>
        <button onclick="toggleAutoEat()">🍱 切换/开启自动进食</button>
      </div>

      <!-- 独立烹饪与熟练度 -->
      <h4 style="margin-top: 15px;">🍳 厨房烹饪 (每种料理单独提升熟练度)</h4>
      <div class="button-group">
        <button id="btn-cook-fruitMashing" onclick="cookFood('fruitMashing')">
          🥣 做甘甜果泥 (2果 | 熟练度: <span id="exp-fruitMashing">0%</span>)
        </button>
        <button id="btn-cook-roastedMeat" onclick="cookFood('roastedMeat')">
          🍖 做香喷喷烤肉 (2肉 | 熟练度: <span id="exp-roastedMeat">0%</span>)
        </button>
        <button id="btn-cook-meatStew" onclick="cookFood('meatStew')">
          🍲 煮森林杂烩汤 (2果 2肉 | 熟练度: <span id="exp-meatStew">0%</span>)
        </button>
      </div>

      <!-- 装备与制药 -->
      <h4 style="margin-top: 15px;">🔨 装备与制作</h4>
      <div class="button-group">
        <button id="btn-craft-medicine" onclick="craftMedicine()">💊 炼制草药膏 (3干草 1野果)</button>
        <button id="btn-weapon" onclick="craftWeapon()">🗡️ 削制小木棍 (5树枝)</button>
      </div>

      <!-- 背包制作 -->
      <h4 style="margin-top: 15px;">🎒 背包缝制</h4>
      <div class="button-group">
        <button id="btn-bag-straw" onclick="craftBackpack('straw')">编织草袋 (20草)</button>
        <button id="btn-bag-leather" onclick="craftBackpack('leather')">简易藤包 (35草 25木)</button>
        <button id="btn-bag-sturdy" onclick="craftBackpack('sturdy')">坚固皮包 (40草 40木 5肉)</button>
      </div>

      <!-- 房屋扩建与房间建造 -->
      <h4 style="margin-top: 15px;">🏠 房屋扩建与房间建造</h4>
      <div class="button-group">
        <button id="btn-upgrade-house" onclick="upgradeHouse()">扩建房屋</button>
        <button id="btn-build-kitchen" onclick="buildRoom('kitchen')">建造厨房</button>
        <button id="btn-build-bedroom" onclick="buildRoom('bedroom')">建造睡房</button>
        <button id="btn-build-classroom" onclick="buildRoom('classroom')">建造课堂</button>
        <button id="btn-build-petcorner" onclick="buildRoom('petcorner')">建造动物游乐角</button>
      </div>
    </div>

    <!-- 已建房间与收藏品 -->
    <div class="section-box">
      <h3>🏠 已建造的房间</h3>
      <div id="room-list"></div>
      
      <h3 style="margin-top: 15px;">🎁 特殊珍藏</h3>
      <div id="special-item-list"></div>
    </div>

    <!-- 动物朋友 -->
    <div class="section-box">
      <h3>🐾 森林里的动物朋友</h3>
      <div id="animal-list"></div>
    </div>

    <!-- 日志面板 -->
    <div class="section-box">
      <h3>📜 森林生活日志</h3>
      <div id="log-box"></div>
    </div>

    <button class="reset-btn" onclick="resetData()">重置游戏数据</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
